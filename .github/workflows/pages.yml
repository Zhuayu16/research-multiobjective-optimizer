name: Browser verification and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install scientific build dependencies
        run: python -m pip install numpy pandas scipy scikit-learn threadpoolctl openpyxl xlrd
      - name: Build software-only static website
        run: python scripts/build_web.py --output outputs/site
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real browser computation, import, export and mobile checks
        working-directory: web
        run: npm test
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification
          retention-days: 14
          path: outputs/web_validation/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish static website
        id: deployment
        uses: actions/deploy-pages@v5
